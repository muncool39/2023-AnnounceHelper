<!DOCTYPE html>
<html lang="kr">
<head>
    <div th:replace="fragments/head::head"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음성분석</title>
</head>
<body>
<div id="wrap">
<div th:replace="fragments/header::header"></div>
<h2>음성 파일 분석하기</h2>
<form action="/upload" method="post" enctype="multipart/form-data">
    <label for="file">음성 파일을 선택하세요:</label>
    <input type="file" name="file" id="file" required>
    <br>
    <label>언어를 선택하세요:</label>
    <input type="radio" name="language" value="korean" checked>한국어
    <input type="radio" name="language" value="english">영어
    <br>
    <button type="submit">Upload</button>
</form>
<!-- Display the uploaded file path -->
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${filePath}" th:text="'File Path: ' + ${filePath}"></p>
<p th:if="${result}" th:text="'코드' + ${result.resultCode}"></p>
<p th:if="${result}" th:text="'텍스트 변환 결과 '+${result.results}"></p>

</div>
<div th:replace="fragments/footer::footer"></div>
</body>
</html>
