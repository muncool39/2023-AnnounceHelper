<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/head::head"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대본분석</title>
</head>
<body>
<div id="wrap">
    <div th:replace="fragments/header::header"></div>
    <div class="inner">
    <h2>발표 대본 분석하기</h2>
    <!-- Display the uploaded file path -->
    <form action="/script/text" method="post" id="uploadText" style="display: block;">
        <label> 발표 대본을 입력하세요 <br/>
            <textarea name="textContent" rows="10" cols="50"></textarea>
        </label>
        <br><br/>
        <button type="button" onclick="showFileForm()">파일로 올리기</button>
        <button type="submit">대본 생성하기</button>
    </form>

    <form action="/script/upload" method="post" id="uploadFile" th:if="${filePath == null}" enctype="multipart/form-data" style="display: none;">
        <label for="file"> 발표 대본을 선택하세요:
            <input type="file" name="file" id="file" required>
        </label>
        <br><br/>
        <button type="button" onclick="showTextForm()">여기서 작성하기</button>
        <button type="submit">업로드하기</button>
    </form>

    <p th:if="${filePath}">해당 파일을 분석하시겠습니까?
    <form action="/script/analysis" method="post" id="analyzeForm" th:if="${filePath != null}" style="display: none;">
        <input type="hidden" th:name="filePath" th:value="${filePath}">
        <button type="submit" class="analysis">분석하기</button>
        <button type="button" th:if="${result}" th:onclick="|location.href='@{script}'|">다시 고르기</button>
    </form>
    </p>

    <p th:if="${result}"> 분석에 성공했습니다!
    <p th:if="${result}" th:text="'대본 텍스트 : '+${result.script}">
    <p th:if="${result}" th:text="'분석 결과 : '+${result.result}"></p>
    <button type="button" th:if="${result}" th:onclick="|location.href='@{script}'|">다시하기</button>
    </p>

    </div>
</div>
<div th:replace="fragments/footer::footer"></div>
<script>
    function showTextForm(){
        document.getElementById('uploadText').style.display = 'block';
        document.getElementById('uploadFile').style.display = 'none';
    }
    function showFileForm(){
        document.getElementById('uploadText').style.display = 'none';
        document.getElementById('uploadFile').style.display = 'block';
    }
</script>

<script th:if="${filePath != null}">
    document.getElementById('uploadText').style.display = 'none';
    document.getElementById('analyzeForm').style.display = 'block';
</script>
<script th:if="${result != null}">
    document.getElementById('uploadText').style.display = 'none';
    document.getElementById('uploadFile').style.display = 'none';
</script>
</body>
</html>
