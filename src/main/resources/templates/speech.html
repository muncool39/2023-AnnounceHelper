<!DOCTYPE html>
<html lang="kr">
<head>
    <div th:replace="fragments/head::head"></div>
    <title>음성분석</title>
</head>
<body>
<div id="wrap">
<div th:replace="fragments/header::header"></div>
    <div id="speech">

    <!-- 음성파일 선택을 위한 from -->
<div class="inner">
    <h2>음성 발음 분석하기</h2>
<form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
    음성 파일을 선택하세요:
    <label for="file"></label>
        <input type="file" name="audioFile" id="file" required>
    <br>
    발음을 비교할 텍스트 파일을 선택하세요:
    <label for="file"></label>
    <input type="file" name="textFile" id="text_file" required>
    <br>
    <label>언어를 선택하세요:
        <input type="radio" name="language" value="korean" checked>한국어
        <input type="radio" name="language" value="english">영어
    </label>
    <br><br/>
    <button type="submit">파일 업로드</button>
</form>


<p th:if="${result}">
    <p th:if="${message}" th:text="${message}" id="firstMessage"></p>
    <p th:if="${result}" th:text="'대본 텍스트 : '+${result.originalScript}"></p>
    <p th:if="${result}" th:text="'음성을 텍스트로 변환한 결과 : '+${result.speechRecognitionResult}"></p>
    <p th:if="${result}" th:text="'발음 평가 결과 : '+${result.pronunciationEvaluationScore}+' /5점'"></p>
    <button type="button" th:if="${result}" th:onclick="|location.href='@{speech}'|">다시하기</button>
</p>

    <!-- 파일 업로드 성공시 필드 -->
    <!--
<p th:if="${filePath}" th:text="'File Path: ' + ${filePath}"></p> -->
    <p th:if="${filePath}">해당 파일을 분석하시겠습니까?
    <!-- 분석 결과를 얻기 위한 from -->
    <form action="/analysis" method="post" id="analyzeForm" th:if="${filePath != null}" style="display: none;">
        <input type="hidden" th:name="audioPath" th:value="${filePath.audioPath}">
        <input type="hidden" th:name="textPath" th:value="${filePath.textPath}">
        <input type="hidden" th:name="language" th:value="${language}">
        <button type="submit" class="analysis">분석하기</button>
        <button type="button" th:if="${filePath != null}" th:onclick="|location.href='@{speech}'|">다시하기</button>
    </form>

    </p>
    </div>
    </div>
</div><!-- wrap -->

<div th:replace="fragments/footer::footer"></div>


<script th:if="${filePath != null}">
    document.getElementById('uploadForm').style.display = 'none';
    document.getElementById('analyzeForm').style.display = 'block';
</script>
<script th:if="${result != null}">
    document.getElementById('firstMessage').style.display = 'none';
    document.getElementById('uploadForm').style.display = 'none';
</script>

</body>
</html>
